[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxwave"
version = "0.1.0"
description = "Calibration-aware, bounded-memory MXFP4 quantization for large language models"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Kyrylo Bilchenko" },
]
keywords = ["llm", "mxfp4", "post-training-quantization", "quantization", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
    "numpy>=1.21",
]

[project.optional-dependencies]
calibrate = [
    "accelerate>=0.28",
    "transformers>=4.40",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
mxwave-calibrate = "mxwave.calibration_cli:main"
mxwave-precision-budget = "mxwave.precision_budget_cli:main"
mxwave-quantize = "mxwave.cli:main"

[project.urls]
Homepage = "https://github.com/kirillbilchenko/MxWave"
Repository = "https://github.com/kirillbilchenko/MxWave.git"
Issues = "https://github.com/kirillbilchenko/MxWave/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mxwave*"]

[tool.setuptools.package-data]
mxwave = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
