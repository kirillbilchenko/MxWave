[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxstream"
version = "0.1.0"
description = "GPU-streaming, calibration-aware, quality-oriented MXFP4 quantization for models that don't fit on one machine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kyrylo Bilchenko" },
]
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
    "numpy>=1.21",
]

[project.optional-dependencies]
calibrate = ["transformers>=4.40"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
mxstream-quantize = "mxstream.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mxstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
